[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo3dcull"
version = "1.0.0"
description = "GPU/CPU-accelerated 3D mesh visibility culling toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OGSMORIC"},
]
keywords = ["3d", "mesh", "culling", "visibility", "geometry", "cuda", "openmp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Full feature set (visualization + decimation)
full = [
    "matplotlib>=3.4",
    "point-cloud-utils>=0.9",
]
# Only visualization (no decimation)
viz = [
    "matplotlib>=3.4",
]
# For development
dev = [
    "pytest>=7.0",
    "matplotlib>=3.4",
    "point-cloud-utils>=0.9",
]

[project.urls]
Homepage = "https://github.com/yourorg/geo3dcull"
Documentation = "https://github.com/yourorg/geo3dcull#readme"
"Source Code" = "https://github.com/yourorg/geo3dcull"

[tool.setuptools.packages.find]
where = ["."]
include = ["geo3dcull*"]
